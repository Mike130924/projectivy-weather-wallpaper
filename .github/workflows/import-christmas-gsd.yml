name: Import Christmas GSD Weather Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname '*.zip' -print)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP archive was found in the repository root."
            find . -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP archive was found in the repository root:"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Using archive: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/christmas-gsd-import"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/christmas-gsd-import"

          PROJECT_ROOT="$(find "$RUNNER_TEMP/christmas-gsd-import" -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_ROOT" ] || { [ ! -f "$PROJECT_ROOT/settings.gradle" ] && [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; }; then
            echo "::error::Could not locate the Gradle project inside the ZIP."
            exit 1
          fi

          echo "Importing project from: $PROJECT_ROOT"

          # Import project files but deliberately preserve this repository's .github folder.
          # This avoids changing workflow files, which require a separate GitHub permission.
          find "$PROJECT_ROOT" -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -a {} . \;

          ARTWORK_ROOT="$(find "$RUNNER_TEMP/christmas-gsd-import" -type d -name artwork-source -print -quit)"
          if [ -n "$ARTWORK_ROOT" ]; then
            mkdir -p artwork-source
            cp -a "$ARTWORK_ROOT"/. artwork-source/
          fi

          chmod +x ./gradlew
          rm -f "$ZIP_FILE"
          rm -f import-christmas-gsd.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import Christmas GSD weather plugin project"
            git push
          fi
